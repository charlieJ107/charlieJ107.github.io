name: Publish legacy GitHub Pages redirects

on:
  push:
    branches: [master]
    paths:
      - '.legacy-pages/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.legacy.outputs.ready }}
    steps:
      - name: Checkout public migration pages
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for the first synchronized migration pages
        id: legacy
        run: |
          if [[ -f .legacy-pages/index.html && -f .legacy-pages/404.html && -f .legacy-pages/.nojekyll ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Migration pages are not present yet; leaving the existing Pages deployment intact.'
          fi

      - name: Upload migration pages
        if: steps.legacy.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .legacy-pages/

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy migration pages to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
