<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This page has moved · 页面已迁移</title>
<meta name="robots" content="noindex">

<script>
(() => {
  const destination = new URL("https://zhuoling.space");
  destination.pathname = window.location.pathname;
  destination.search = window.location.search;
  destination.hash = window.location.hash;
  window.location.replace(destination.href);
})();
</script>
</head>
<body>
<h1>This website has moved · 网站已迁移</h1>
<p>Open the same path on the new website. 请在新网站打开相同路径。</p>
<p><a id="destination" href="https://zhuoling.space">https://zhuoling.space</a></p>
<script>
(() => {
  const destination = new URL("https://zhuoling.space");
  destination.pathname = window.location.pathname;
  destination.search = window.location.search;
  destination.hash = window.location.hash;
  const link = document.getElementById('destination');
  link.href = destination.href;
  link.textContent = destination.href;
})();
</script>
</body>
</html>
