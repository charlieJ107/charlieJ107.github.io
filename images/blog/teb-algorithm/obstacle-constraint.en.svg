<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" width="660" height="450" role="img" aria-label="TEB places control points along the global path at equal time intervals; a control point that falls inside an obstacle's safety distance is pushed back outside it, deforming the whole local trajectory like a rubber band">
  <title>Obstacle constraint: control points get pushed away</title>
  <style>
    .txt   { fill: #334155; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .ink   { stroke: #475569; fill: none; }
    .f-ink { fill: #475569; }
    .muted { stroke: #94a3b8; fill: none; }
    .cand  { stroke: #94a3b8; fill: none; stroke-width: 1.5; }
    .bad   { stroke: #d14343; fill: none; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .bad-s { stroke: #d14343; fill: none; stroke-width: 2.2; }
    .f-bad { fill: #d14343; }
    .hollow-bad { fill: #ffffff; fill-opacity: 0; stroke: #d14343; stroke-width: 1.8; stroke-dasharray: 3 3; }
    .best  { stroke: #2f855a; fill: none; stroke-width: 3.2; }
    .f-best{ fill: #2f855a; }
    .obs   { fill: #d14343; fill-opacity: .16; stroke: #d14343; stroke-width: 1.6; }
    .ring  { fill: none; stroke: #d14343; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .glob  { stroke: #5a63d8; fill: none; stroke-width: 2; stroke-dasharray: 7 5; }
    .f-glob{ fill: #5a63d8; }
    @media (prefers-color-scheme: dark) {
      .txt { fill: #cbd5e1; }
      .ink { stroke: #cbd5e1; } .f-ink { fill: #cbd5e1; }
      .muted { stroke: #64748b; }
      .cand { stroke: #6b7a8f; }
      .bad, .bad-s { stroke: #f87171; } .f-bad { fill: #f87171; }
      .hollow-bad { stroke: #f87171; }
      .best { stroke: #4ade80; } .f-best { fill: #4ade80; }
      .obs { fill: #f87171; fill-opacity: .2; stroke: #f87171; }
      .ring { stroke: #f87171; }
      .glob { stroke: #a5b4fc; } .f-glob { fill: #a5b4fc; }
    }
  </style>
