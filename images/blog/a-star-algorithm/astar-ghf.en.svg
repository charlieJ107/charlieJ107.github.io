<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 476" width="700" height="476" role="img" aria-label="The g, h and f values on each cell of an A* expansion: g is the number of steps actually taken from the start, h is the Manhattan-distance estimate to the goal, and f is their sum; every round the algorithm takes the cell with the smallest f out of the open list and expands it">
  <title>g, h and f in A*</title>
  <style>
    .txt   { fill: #334155; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
