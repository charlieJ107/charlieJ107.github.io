<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 430" width="810" height="430" role="img" aria-label="The structure of ROS move_base: the goal, the map, sensor data and odometry feed into move_base, where the global planner computes a whole path from the global costmap and the local planner follows that path using the local costmap and emits velocity commands">
  <title>Global and local planners in move_base</title>
  <style>
    .txt   { fill: #334155; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .txt-w { fill: #ffffff; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .mono  { fill: #475569; font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; }
    .ink   { stroke: #475569; fill: none; }
    .f-ink { fill: #475569; }
    .muted { stroke: #94a3b8; fill: none; }
    .grid  { stroke: #cbd5e1; fill: none; stroke-width: 1; }
    .wall  { fill: #475569; }
    .box   { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
    .box-a { fill: #2f855a; fill-opacity: .12; stroke: #2f855a; stroke-width: 1.6; }
    .box-b { fill: #5a63d8; fill-opacity: .12; stroke: #5a63d8; stroke-width: 1.6; }
    .box-o { fill: #94a3b8; fill-opacity: .14; stroke: #94a3b8; stroke-width: 1.4; }
    .dij   { fill: #5a63d8; fill-opacity: .22; }
    .ast   { fill: #2f855a; fill-opacity: .24; }
    .open  { fill: #e0a02c; fill-opacity: .3; }
    .bad   { stroke: #d14343; fill: none; stroke-width: 2; }
    .f-bad { fill: #d14343; }
    .best  { stroke: #2f855a; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .f-best{ fill: #2f855a; }
    .glob  { stroke: #5a63d8; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .f-glob{ fill: #5a63d8; }
    .dash  { stroke: #d14343; fill: none; stroke-width: 2; stroke-dasharray: 6 4; }
    .p1    { stroke: #2f855a; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .p2    { stroke: #5a63d8; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .p3    { stroke: #e0a02c; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .f-p3  { fill: #e0a02c; }
    @media (prefers-color-scheme: dark) {
      .txt { fill: #cbd5e1; } .txt-w { fill: #0b1220; } .mono { fill: #cbd5e1; }
      .ink { stroke: #cbd5e1; } .f-ink { fill: #cbd5e1; }
      .muted { stroke: #64748b; }
      .grid { stroke: #3f4a5a; }
      .wall { fill: #8496ad; }
      .box  { fill: #111827; stroke: #cbd5e1; }
      .box-a { fill: #4ade80; fill-opacity: .16; stroke: #4ade80; }
      .box-b { fill: #a5b4fc; fill-opacity: .16; stroke: #a5b4fc; }
      .box-o { fill: #64748b; fill-opacity: .2; stroke: #94a3b8; }
      .dij  { fill: #a5b4fc; fill-opacity: .26; }
      .ast  { fill: #4ade80; fill-opacity: .26; }
      .open { fill: #fbbf24; fill-opacity: .3; }
      .bad  { stroke: #f87171; } .f-bad { fill: #f87171; }
      .best { stroke: #4ade80; } .f-best { fill: #4ade80; }
      .glob { stroke: #a5b4fc; } .f-glob { fill: #a5b4fc; }
      .dash { stroke: #f87171; }
      .p1 { stroke: #4ade80; } .p2 { stroke: #a5b4fc; } .p3 { stroke: #fbbf24; } .f-p3 { fill: #fbbf24; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="f-ink" />
    </marker>
    <marker id="ah-best" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="f-best" />
    </marker>
  </defs>
  <g>
    <rect x="198" y="72" width="368" height="266" rx="12" class="box-o" />
    <text class="txt" x="214" y="96" font-size="15" font-weight="600">move_base</text>

    <rect x="222" y="118" width="150" height="46" rx="8" class="box-b" />
    <text class="txt" x="297" y="140" font-size="13" text-anchor="middle">global_costmap</text>
    <text class="txt" x="297" y="156" font-size="11" text-anchor="middle">Static map + inflation</text>

    <rect x="222" y="184" width="150" height="46" rx="8" class="box-b" />
    <text class="txt" x="297" y="206" font-size="13" text-anchor="middle">global_planner</text>
    <text class="txt" x="297" y="222" font-size="11" text-anchor="middle">A* / Dijkstra</text>

    <rect x="392" y="118" width="150" height="46" rx="8" class="box-a" />
    <text class="txt" x="467" y="140" font-size="13" text-anchor="middle">local_costmap</text>
    <text class="txt" x="467" y="156" font-size="11" text-anchor="middle">Live sensor data</text>

    <rect x="392" y="184" width="150" height="46" rx="8" class="box-a" />
    <text class="txt" x="467" y="206" font-size="13" text-anchor="middle">local_planner</text>
    <text class="txt" x="467" y="222" font-size="11" text-anchor="middle">DWA / TEB</text>

    <rect x="222" y="268" width="320" height="42" rx="8" class="box" />
    <text class="txt" x="382" y="294" font-size="13" text-anchor="middle">recovery_behaviors (clear costmap, rotate in place, give up)</text>

    <line x1="297" y1="164" x2="297" y2="180" class="ink" stroke-width="1.4" marker-end="url(#ah)" />
    <line x1="467" y1="164" x2="467" y2="180" class="ink" stroke-width="1.4" marker-end="url(#ah)" />
    <line x1="372" y1="207" x2="388" y2="207" class="ink" stroke-width="1.6" marker-end="url(#ah)" />
    <text class="txt" x="380" y="248" font-size="11" text-anchor="middle">Global path</text>

    <rect x="16" y="90" width="156" height="42" rx="8" class="box" />
    <text class="txt" x="94" y="107" font-size="12.5" text-anchor="middle">Goal</text>
    <text class="txt" x="94" y="123" font-size="11" text-anchor="middle">/move_base_simple/goal</text>
    <rect x="16" y="146" width="156" height="34" rx="8" class="box" />
    <text class="txt" x="94" y="168" font-size="12.5" text-anchor="middle">map_server  /map</text>
    <rect x="16" y="196" width="156" height="34" rx="8" class="box" />
    <text class="txt" x="94" y="218" font-size="12.5" text-anchor="middle">amcl  localisation /tf</text>
    <rect x="16" y="246" width="156" height="34" rx="8" class="box" />
    <text class="txt" x="94" y="268" font-size="12.5" text-anchor="middle">Sensors /scan</text>
    <rect x="16" y="296" width="156" height="34" rx="8" class="box" />
    <text class="txt" x="94" y="318" font-size="12.5" text-anchor="middle">Odometry /odom</text>

    <line x1="172" y1="113" x2="194" y2="113" class="ink" stroke-width="1.4" marker-end="url(#ah)" />
    <line x1="172" y1="163" x2="194" y2="163" class="ink" stroke-width="1.4" marker-end="url(#ah)" />
    <line x1="172" y1="213" x2="194" y2="213" class="ink" stroke-width="1.4" marker-end="url(#ah)" />
    <line x1="172" y1="263" x2="194" y2="263" class="ink" stroke-width="1.4" marker-end="url(#ah)" />
    <line x1="172" y1="313" x2="194" y2="313" class="ink" stroke-width="1.4" marker-end="url(#ah)" />

    <rect x="648" y="186" width="140" height="42" rx="8" class="box" />
    <text class="txt" x="718" y="203" font-size="12.5" text-anchor="middle">Base driver</text>
    <text class="txt" x="718" y="220" font-size="12.5" text-anchor="middle">base_controller</text>
    <line x1="566" y1="207" x2="644" y2="207" class="ink" stroke-width="1.6" marker-end="url(#ah)" />
    <text class="txt" x="605" y="198" font-size="11" text-anchor="middle">/cmd_vel</text>

    <text class="txt" x="405" y="378" font-size="13" text-anchor="middle">Global planner: sees only the static map and plans the whole route in one go — the A* of this article lives here</text>
    <text class="txt" x="405" y="400" font-size="13" text-anchor="middle">Local planner: sees only the road ahead, replans continuously from live sensors and issues velocities</text>
  </g>
</svg>
