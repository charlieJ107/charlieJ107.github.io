<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 272" width="700" height="272" role="img" aria-label="Manhattan distance: on a grid that allows only up, down, left and right moves, every staircase route from A to B takes 7 steps, equal to the sum of the absolute coordinate differences, whereas the straight-line distance between the two points is 5">
  <title>Manhattan distance</title>
  <style>
    .txt   { fill: #334155; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .txt-w { fill: #ffffff; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .mono  { fill: #475569; font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; }
    .ink   { stroke: #475569; fill: none; }
    .f-ink { fill: #475569; }
    .muted { stroke: #94a3b8; fill: none; }
    .grid  { stroke: #cbd5e1; fill: none; stroke-width: 1; }
    .wall  { fill: #475569; }
    .box   { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
    .box-a { fill: #2f855a; fill-opacity: .12; stroke: #2f855a; stroke-width: 1.6; }
    .box-b { fill: #5a63d8; fill-opacity: .12; stroke: #5a63d8; stroke-width: 1.6; }
    .box-o { fill: #94a3b8; fill-opacity: .14; stroke: #94a3b8; stroke-width: 1.4; }
    .dij   { fill: #5a63d8; fill-opacity: .22; }
    .ast   { fill: #2f855a; fill-opacity: .24; }
    .open  { fill: #e0a02c; fill-opacity: .3; }
    .bad   { stroke: #d14343; fill: none; stroke-width: 2; }
    .f-bad { fill: #d14343; }
    .best  { stroke: #2f855a; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .f-best{ fill: #2f855a; }
    .glob  { stroke: #5a63d8; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .f-glob{ fill: #5a63d8; }
    .dash  { stroke: #d14343; fill: none; stroke-width: 2; stroke-dasharray: 6 4; }
    .p1    { stroke: #2f855a; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .p2    { stroke: #5a63d8; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .p3    { stroke: #e0a02c; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .f-p3  { fill: #e0a02c; }
    @media (prefers-color-scheme: dark) {
      .txt { fill: #cbd5e1; } .txt-w { fill: #0b1220; } .mono { fill: #cbd5e1; }
      .ink { stroke: #cbd5e1; } .f-ink { fill: #cbd5e1; }
      .muted { stroke: #64748b; }
      .grid { stroke: #3f4a5a; }
      .wall { fill: #8496ad; }
      .box  { fill: #111827; stroke: #cbd5e1; }
      .box-a { fill: #4ade80; fill-opacity: .16; stroke: #4ade80; }
      .box-b { fill: #a5b4fc; fill-opacity: .16; stroke: #a5b4fc; }
      .box-o { fill: #64748b; fill-opacity: .2; stroke: #94a3b8; }
      .dij  { fill: #a5b4fc; fill-opacity: .26; }
      .ast  { fill: #4ade80; fill-opacity: .26; }
      .open { fill: #fbbf24; fill-opacity: .3; }
      .bad  { stroke: #f87171; } .f-bad { fill: #f87171; }
      .best { stroke: #4ade80; } .f-best { fill: #4ade80; }
      .glob { stroke: #a5b4fc; } .f-glob { fill: #a5b4fc; }
      .dash { stroke: #f87171; }
      .p1 { stroke: #4ade80; } .p2 { stroke: #a5b4fc; } .p3 { stroke: #fbbf24; } .f-p3 { fill: #fbbf24; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="f-ink" />
    </marker>
    <marker id="ah-best" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="f-best" />
    </marker>
  </defs>
  <g>
    <line x1="60" y1="42" x2="60" y2="226" class="grid" />
    <line x1="106" y1="42" x2="106" y2="226" class="grid" />
    <line x1="152" y1="42" x2="152" y2="226" class="grid" />
    <line x1="198" y1="42" x2="198" y2="226" class="grid" />
    <line x1="244" y1="42" x2="244" y2="226" class="grid" />
    <line x1="290" y1="42" x2="290" y2="226" class="grid" />
    <line x1="60" y1="42" x2="290" y2="42" class="grid" />
    <line x1="60" y1="88" x2="290" y2="88" class="grid" />
    <line x1="60" y1="134" x2="290" y2="134" class="grid" />
    <line x1="60" y1="180" x2="290" y2="180" class="grid" />
    <line x1="60" y1="226" x2="290" y2="226" class="grid" />
    <line x1="60" y1="226" x2="244" y2="88" class="dash" />
    <polyline class="p1" points="60,226 244,226 244,88" />
    <polyline class="p2" points="60,226 60,88 244,88" />
    <polyline class="p3" points="60,226 106,226 106,134 198,134 198,88 244,88" />
    <circle cx="60" cy="226" r="9" class="f-ink" />
    <text class="txt" x="44" y="248" font-size="14" text-anchor="middle">A (1, 1)</text>
    <circle cx="244" cy="88" r="9" class="f-ink" />
    <text class="txt" x="262" y="74" font-size="14" text-anchor="middle">B (5, 4)</text>
    <text class="txt" x="210" y="193" font-size="13">Straight-line distance 5</text>

    <g transform="translate(396,60)">
      <text class="txt" x="0" y="0" font-size="14">Δx = |5 − 1| = 4</text>
      <text class="txt" x="0" y="26" font-size="14">Δy = |4 − 1| = 3</text>
      <line x1="0" y1="42" x2="230" y2="42" class="muted" stroke-width="1.2" />
      <text class="txt" x="0" y="66" font-size="14" font-weight="600">Manhattan distance = 4 + 3 = 7</text>
      <text class="txt" x="0" y="96" font-size="13">The three routes differ,</text>
      <text class="txt" x="0" y="116" font-size="13">but all take 7 steps — if you never backtrack,</text>
      <text class="txt" x="0" y="136" font-size="13">the count does not depend on how you zigzag.</text>
      <text class="txt" x="0" y="166" font-size="13">Two subtractions, one addition, no square root —</text>
      <text class="txt" x="0" y="186" font-size="13">that is where it beats Euclidean distance.</text>
    </g>
  </g>
</svg>
