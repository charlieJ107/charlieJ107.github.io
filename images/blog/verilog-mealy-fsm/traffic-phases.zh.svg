<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 366" width="850" height="366" role="img">
  <style>
    .txt   { fill: #334155; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .txt-w { fill: #ffffff; font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .mono  { fill: #475569; font-family: ui-monospace,"Cascadia Mono",Consolas,monospace; }
    .ink   { stroke: #475569; fill: none; }
    .f-ink { fill: #475569; }
    .muted { stroke: #94a3b8; fill: none; }
    .grid  { stroke: #cbd5e1; fill: none; stroke-width: 1; }
    .box   { fill: #ffffff; stroke: #475569; stroke-width: 1.6; }
    .wave  { stroke: #475569; fill: none; stroke-width: 1.8; stroke-linejoin: round; }
    .bus   { fill: #94a3b8; fill-opacity: .14; stroke: #475569; stroke-width: 1.4; }
    .hit   { stroke: #2f855a; fill: none; stroke-width: 2.4; stroke-linejoin: round; }
    .f-hit { fill: #2f855a; }
    .hitbg { fill: #2f855a; fill-opacity: .13; }
    .bad   { stroke: #d14343; fill: none; stroke-width: 2; }
    .f-bad { fill: #d14343; }
    .badbg { fill: #d14343; fill-opacity: .12; }
    .dash  { stroke: #d14343; fill: none; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .gdash { stroke: #2f855a; fill: none; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .lr    { fill: #d14343; }
    .ly    { fill: #e0a02c; }
    .lg    { fill: #2f855a; }
    @media (prefers-color-scheme: dark) {
      .txt { fill: #cbd5e1; } .txt-w { fill: #0b1220; } .mono { fill: #cbd5e1; }
      .ink { stroke: #cbd5e1; } .f-ink { fill: #cbd5e1; }
      .muted { stroke: #64748b; }
      .grid { stroke: #3f4a5a; }
      .box  { fill: #111827; stroke: #cbd5e1; }
      .wave { stroke: #cbd5e1; }
      .bus  { fill: #64748b; fill-opacity: .22; stroke: #cbd5e1; }
      .hit  { stroke: #4ade80; } .f-hit { fill: #4ade80; } .hitbg { fill: #4ade80; fill-opacity: .16; }
      .bad  { stroke: #f87171; } .f-bad { fill: #f87171; } .badbg { fill: #f87171; fill-opacity: .16; }
      .dash { stroke: #f87171; } .gdash { stroke: #4ade80; }
      .lr { fill: #f87171; } .ly { fill: #fbbf24; } .lg { fill: #4ade80; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="f-ink" />
    </marker>
    <marker id="ah-hit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="f-hit" />
    </marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="f-bad" />
    </marker>
  </defs>
<text x="425" y="30" class="txt" font-size="16" text-anchor="middle" font-weight="600">交通灯相位时序（仿真实测，一个完整循环 30 拍 clk_3Hz）</text>
<text x="425" y="52" class="txt" font-size="12" text-anchor="middle">lights[5:3] = 东西方向，lights[2:0] = 南北方向，均为独热码：红 100 / 黄 010 / 绿 001</text>
<text x="106" y="102" class="mono" font-size="12" text-anchor="end">state</text>
<rect x="118" y="84" width="345" height="26" class="bus" rx="3" />
<text x="290.5" y="102" class="mono" font-size="12" text-anchor="middle">S0</text>
<rect x="463" y="84" width="69" height="26" class="bus" rx="3" />
<text x="497.5" y="102" class="mono" font-size="12" text-anchor="middle">S1</text>
<rect x="532" y="84" width="69" height="26" class="bus" rx="3" />
<text x="566.5" y="102" class="mono" font-size="12" text-anchor="middle">S2</text>
<rect x="601" y="84" width="69" height="26" class="bus" rx="3" />
<text x="635.5" y="102" class="mono" font-size="12" text-anchor="middle">S3</text>
<rect x="670" y="84" width="69" height="26" class="bus" rx="3" />
<text x="704.5" y="102" class="mono" font-size="12" text-anchor="middle">S4</text>
<rect x="739" y="84" width="69" height="26" class="bus" rx="3" />
<text x="773.5" y="102" class="mono" font-size="12" text-anchor="middle">S5</text>
<text x="106" y="159" class="txt" font-size="13" text-anchor="end">南北方向</text>
<rect x="118" y="134" width="343.5" height="38" class="lg" rx="4" />
<text x="290.5" y="151" class="txt-w" font-size="13" text-anchor="middle" font-weight="600">绿</text>
<text x="290.5" y="165" class="txt-w" font-size="11" text-anchor="middle">5 s</text>
<rect x="463" y="134" width="67.5" height="38" class="ly" rx="4" />
<text x="497.5" y="151" class="txt-w" font-size="13" text-anchor="middle" font-weight="600">黄</text>
<text x="497.5" y="165" class="txt-w" font-size="11" text-anchor="middle">1 s</text>
<rect x="532" y="134" width="274.5" height="38" class="lr" rx="4" />
<text x="670" y="151" class="txt-w" font-size="13" text-anchor="middle" font-weight="600">红</text>
<text x="670" y="165" class="txt-w" font-size="11" text-anchor="middle">4 s</text>
<text x="106" y="215" class="txt" font-size="13" text-anchor="end">东西方向</text>
<rect x="118" y="190" width="481.5" height="38" class="lr" rx="4" />
<text x="359.5" y="207" class="txt-w" font-size="13" text-anchor="middle" font-weight="600">红</text>
<text x="359.5" y="221" class="txt-w" font-size="11" text-anchor="middle">7 s</text>
<rect x="601" y="190" width="67.5" height="38" class="lg" rx="4" />
<text x="635.5" y="207" class="txt-w" font-size="13" text-anchor="middle" font-weight="600">绿</text>
<text x="635.5" y="221" class="txt-w" font-size="11" text-anchor="middle">1 s</text>
<rect x="670" y="190" width="67.5" height="38" class="ly" rx="4" />
<text x="704.5" y="207" class="txt-w" font-size="13" text-anchor="middle" font-weight="600">黄</text>
<text x="704.5" y="221" class="txt-w" font-size="11" text-anchor="middle">1 s</text>
<rect x="739" y="190" width="67.5" height="38" class="lr" rx="4" />
<text x="773.5" y="207" class="txt-w" font-size="13" text-anchor="middle" font-weight="600">红</text>
<text x="773.5" y="221" class="txt-w" font-size="11" text-anchor="middle">1 s</text>
<line x1="118" y1="244" x2="808" y2="244" class="muted" stroke-width="1" />
<line x1="118" y1="244" x2="118" y2="249" class="muted" stroke-width="1" />
<text x="118" y="262" class="mono" font-size="10" text-anchor="middle">0</text>
<line x1="187" y1="244" x2="187" y2="249" class="muted" stroke-width="1" />
<text x="187" y="262" class="mono" font-size="10" text-anchor="middle">1</text>
<line x1="256" y1="244" x2="256" y2="249" class="muted" stroke-width="1" />
<text x="256" y="262" class="mono" font-size="10" text-anchor="middle">2</text>
<line x1="325" y1="244" x2="325" y2="249" class="muted" stroke-width="1" />
<text x="325" y="262" class="mono" font-size="10" text-anchor="middle">3</text>
<line x1="394" y1="244" x2="394" y2="249" class="muted" stroke-width="1" />
<text x="394" y="262" class="mono" font-size="10" text-anchor="middle">4</text>
<line x1="463" y1="244" x2="463" y2="249" class="muted" stroke-width="1" />
<text x="463" y="262" class="mono" font-size="10" text-anchor="middle">5</text>
<line x1="532" y1="244" x2="532" y2="249" class="muted" stroke-width="1" />
<text x="532" y="262" class="mono" font-size="10" text-anchor="middle">6</text>
<line x1="601" y1="244" x2="601" y2="249" class="muted" stroke-width="1" />
<text x="601" y="262" class="mono" font-size="10" text-anchor="middle">7</text>
<line x1="670" y1="244" x2="670" y2="249" class="muted" stroke-width="1" />
<text x="670" y="262" class="mono" font-size="10" text-anchor="middle">8</text>
<line x1="739" y1="244" x2="739" y2="249" class="muted" stroke-width="1" />
<text x="739" y="262" class="mono" font-size="10" text-anchor="middle">9</text>
<line x1="808" y1="244" x2="808" y2="249" class="muted" stroke-width="1" />
<text x="808" y="262" class="mono" font-size="10" text-anchor="middle">10</text>
<text x="106" y="262" class="txt" font-size="11" text-anchor="end">秒</text>
<rect x="601" y="78" width="69" height="150" class="badbg" rx="4" />
<path d="M 635.5 296 L 635.5 274" class="bad" marker-end="url(#ah-bad)" />
<text x="625.5" y="312" class="f-bad" font-size="13" text-anchor="end" font-weight="600">东西方向绿灯只亮了 1 s</text>
<text x="625.5" y="330" class="f-bad" font-size="12" text-anchor="end">而状态表里写的是 5 s —— S3 分支误用了 SEC1</text>
<text x="625.5" y="348" class="txt" font-size="12" text-anchor="end">整个循环 30 拍 = 10 s，而非预期的 42 拍 = 14 s</text>
</svg>
